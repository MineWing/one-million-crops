# One Million Crops uses the same configurable action format as Rivet and EveryBlock.
# Supported tags: [message], [broadcast], [actionbar], [title], [sound],
# [particles], [firework], [bossbar], and [countdown]. All text uses MiniMessage.
message-palette-version: 2
prefix: '<#FF8FBD><bold>CROPS</bold></#FF8FBD> <dark_gray>›</dark_gray>'

# GUI and wand lore supports either a YAML list (recommended) or a legacy
# single string. Blank list entries create spacing between sections.
gui:
  navigation:
    previous:
      - '<dark_gray>│</dark_gray> <yellow>Left-click</yellow> <gray>to view the previous page.</gray>'
    next:
      - '<dark_gray>│</dark_gray> <yellow>Left-click</yellow> <gray>to view the next page.</gray>'
    close:
      - '<dark_gray>│</dark_gray> <red>Left-click</red> <gray>to close this menu.</gray>'
  crop-toggle:
    crop:
      - ''
      - '%status%'
      - ''
      - '<dark_gray>│</dark_gray> <yellow>Left-click</yellow> <gray>to %action% this crop.</gray>'
      - '<dark_gray>│ Progress is preserved while disabled.</dark_gray>'
    summary:
      - ''
      - '<dark_gray>│</dark_gray> <gray>Enabled:</gray> <green><bold>%enabled%</bold></green><gray>/%configured%</gray>'
      - '<dark_gray>│ At least one crop must remain enabled.</dark_gray>'
  progress:
    crop:
      - ''
      - '%bar%'
      - '<dark_gray>│</dark_gray> <gray>Collected:</gray> <white><bold>%amount%</bold> / %target%</white>'
      - '<dark_gray>│</dark_gray> <gray>Complete:</gray> <white>%percent%%</white>'
      - '<dark_gray>│</dark_gray> <gray>Remaining:</gray> <white>%remaining%</white>'
      - ''
      - '<dark_gray>│</dark_gray> <aqua>Your contribution:</aqua> <white>%contribution%</white>'
      - '%status%'
    overall:
      - ''
      - '%bar%'
      - '<dark_gray>│</dark_gray> <gray>Overall:</gray> <white>%percent%%</white>'
      - '<dark_gray>│</dark_gray> <gray>Crops complete:</gray> <white>%completed%/%total%</white>'
  crop-wand:
    lore:
      - '<gray>Manage eligible crops stored in a container.</gray>'
      - ''
      - '<dark_gray>│</dark_gray> <#FF8FBD>Left-click</#FF8FBD> <gray>to inspect stored crops.</gray>'
      - '<dark_gray>│</dark_gray> <#FF8FBD>Right-click</#FF8FBD> <gray>to deposit eligible crops.</gray>'
      - '<dark_gray>│</dark_gray> <#FF8FBD>Shift-right-click</#FF8FBD> <gray>to deposit and clear seeds.</gray>'
      - ''
      - '<dark_gray>│ Unmarked and blocked items are ignored.</dark_gray>'
  plant-wand:
    wand:
      - '<gray>Select farmland and plant it from your inventory.</gray>'
      - ''
      - '<dark_gray>│</dark_gray> <#FF8FBD>Left-click</#FF8FBD> <gray>to select the first corner.</gray>'
      - '<dark_gray>│</dark_gray> <#FF8FBD>Right-click</#FF8FBD> <gray>to select the second corner.</gray>'
      - '<dark_gray>│ The crop menu opens after corner two.</dark_gray>'
    crop-option:
      - ''
      - '<dark_gray>│</dark_gray> <gray>Empty farmland:</gray> <white>%farmland%</white>'
      - '<dark_gray>│</dark_gray> <gray>Available:</gray> %available%'
      - ''
      - '<dark_gray>│</dark_gray> %action%'
    menu-summary:
      - '<gray>Choose what to plant below.</gray>'
      - ''
      - '<dark_gray>│ Up to %maximum% blocks per use.</dark_gray>'

no-permission:
  enabled: true
  actions:
    - '[message] %prefix% <white>You do not have permission to do that.</white>'
    - '[sound] ENTITY_VILLAGER_NO 0.7 1.0'
player-only:
  enabled: true
  actions:
    - '[message] %prefix% <white>Only a player can use that command.</white>'
unknown-crop:
  enabled: true
  actions:
    - '[message] %prefix% <white>No challenge crop matches <#FF8FBD>%crop%</#FF8FBD>. Try <#FF8FBD>/1m status</#FF8FBD>.</white>'
reloaded:
  enabled: true
  actions:
    - '[message] %prefix% <white>Configuration and messages reloaded.</white>'
    - '[sound] UI_BUTTON_CLICK 0.7 1.35'
scoreboard-on:
  enabled: true
  actions:
    - '[message] %prefix% <white>Live scoreboard <#FF8FBD>enabled</#FF8FBD>.</white>'
    - '[sound] UI_BUTTON_CLICK 0.6 1.35'
scoreboard-off:
  enabled: true
  actions:
    - '[message] %prefix% <white>Live scoreboard <gray>hidden</gray>.</white>'
    - '[sound] UI_BUTTON_CLICK 0.6 0.85'
crop-toggle-updating:
  enabled: true
  actions:
    - '[message] %prefix% <white>Updating </white>%crop%<white>...</white>'
crop-enabled:
  enabled: true
  actions:
    - '[message] %prefix% %crop% <white>is now <#FF8FBD>enabled</#FF8FBD> and counts toward the challenge.</white>'
    - '[sound] UI_BUTTON_CLICK 0.7 1.35'
crop-disabled:
  enabled: true
  actions:
    - '[message] %prefix% %crop% <white>is now <gray>disabled</gray>. Its saved progress is preserved.</white>'
    - '[sound] UI_BUTTON_CLICK 0.7 0.8'
crop-toggle-last:
  enabled: true
  actions:
    - '[message] %prefix% <white>At least one crop must remain enabled.</white>'
    - '[sound] ENTITY_VILLAGER_NO 0.7 1.0'
crop-toggle-failed:
  enabled: true
  actions:
    - '[message] %prefix% <white>The crop configuration could not be updated. Check the console.</white>'
reset-warning:
  enabled: true
  actions:
    - '[message] %prefix% <red><bold>DANGER</bold></red> <dark_gray>•</dark_gray> <white>Use <#FF8FBD>/1m reset confirm</#FF8FBD> to erase all challenge progress.</white>'
    - '[sound] ENTITY_VILLAGER_NO 0.8 0.8'
reset-complete:
  enabled: true
  actions:
    - '[message] %prefix% <white>All challenge progress was reset. Fresh start!</white>'
    - '[sound] BLOCK_RESPAWN_ANCHOR_DEPLETE 0.8 0.8'
crop-reset-complete:
  enabled: true
  actions:
    - '[message] %prefix% <white>Progress for </white>%crop%<white> was reset.</white>'
    - '[sound] BLOCK_RESPAWN_ANCHOR_DEPLETE 0.7 1.1'
backup-complete:
  enabled: true
  actions:
    - '[message] %prefix% <white>Backup created <dark_gray>•</dark_gray> <#FF8FBD>%file%</#FF8FBD></white>'
    - '[sound] UI_BUTTON_CLICK 0.7 1.35'
backup-failed:
  enabled: true
  actions:
    - '[message] %prefix% <white>The backup could not be created. Check the console.</white>'
reload-failed:
  enabled: true
  actions:
    - '[message] %prefix% <white>Reload failed. Existing progress is safe; check the console.</white>'
automode-enabled:
  enabled: true
  actions:
    - '[message] %prefix% <white>Automated farms (water, pistons, hoppers) now <#FF8FBD>count automatically</#FF8FBD>.</white>'
    - '[sound] UI_BUTTON_CLICK 0.7 1.35'
automode-disabled:
  enabled: true
  actions:
    - '[message] %prefix% <white>Automated farms (water, pistons, hoppers) no longer count without a player harvesting.</white>'
    - '[sound] UI_BUTTON_CLICK 0.7 0.8'
automode-toggle-failed:
  enabled: true
  actions:
    - '[message] %prefix% <white>Automode could not be updated. Check the console.</white>'
reset-failed:
  enabled: true
  actions:
    - '[message] %prefix% <white>Reset failed. No progress was erased; check the console.</white>'
operation-running:
  enabled: true
  actions:
    - '[message] %prefix% <white>Another database operation is already running.</white>'
web-running:
  enabled: true
  actions:
    - '[message] %prefix% <white>Live dashboard <dark_gray>•</dark_gray> <#FF8FBD><click:open_url:''%url%''><hover:show_text:''<white>Open dashboard</white>''>%url%</hover></click></#FF8FBD></white>'
web-disabled:
  enabled: true
  actions:
    - '[message] %prefix% <white>The live dashboard is disabled or unavailable.</white>'
help:
  enabled: true
  actions:
    - '[message] <#FF8FBD><bold>ONE MILLION CROPS</bold></#FF8FBD> <dark_gray>—</dark_gray> <white>shared harvest challenge</white>'
    - '[message] <#FF8FBD>/progress [crop]</#FF8FBD> <dark_gray>—</dark_gray> <white>open challenge progress</white>'
    - '[message] <#FF8FBD>/1m status</#FF8FBD> <dark_gray>—</dark_gray> <white>show every crop total</white>'
    - '[message] <#FF8FBD>/1m scoreboard</#FF8FBD> <dark_gray>—</dark_gray> <white>toggle the live sidebar</white>'
    - '[message] <#FF8FBD>/1m web</#FF8FBD> <dark_gray>—</dark_gray> <white>open the live dashboard</white>'
    - '[message] <#FF8FBD>/1m wand</#FF8FBD> <dark_gray>—</dark_gray> <white>receive a crop storage wand</white>'
    - '[message] <#FF8FBD>/1m plantwand</#FF8FBD> <dark_gray>—</dark_gray> <white>select farmland and plant it from a crop menu</white>'
crop-wand-received:
  enabled: true
  actions:
    - '[message] %prefix% <white>Crop Wand received.</white> <gray>Left-click to inspect, right-click to deposit, or shift-right-click to deposit and clear seeds.</gray>'
    - '[sound] ENTITY_ITEM_PICKUP 0.7 1.35'
crop-wand-inventory-full:
  enabled: true
  actions:
    - '[message] %prefix% <white>Make room in your inventory before requesting a Crop Wand.</white>'
crop-wand-container-only:
  enabled: true
  actions:
    - '[message] %prefix% <white>The Crop Wand works on chests, trapped chests, barrels, hoppers, and placed shulker boxes.</white>'
crop-wand-inspect-header:
  enabled: true
  actions:
    - '[message] <#FF8FBD><bold>STORAGE CONTENTS</bold></#FF8FBD> <dark_gray>•</dark_gray> <white>%total% eligible crops</white>'
crop-wand-inspect-line:
  enabled: true
  actions:
    - '[message] <dark_gray>  •</dark_gray> %crop% <dark_gray>—</dark_gray> <white>%amount%</white>'
crop-wand-inspect-empty:
  enabled: true
  actions:
    - '[message] %prefix% <white>This storage contains no eligible crops.</white>'
crop-wand-ignored:
  enabled: true
  actions:
    - '[message] %prefix% <gray>Skipped <white>%amount%</white> unmarked or blocked crops that may already have counted.</gray>'
crop-wand-deposit-header:
  enabled: true
  actions:
    - '[message] <#FF8FBD><bold>CROPS DEPOSITED</bold></#FF8FBD> <dark_gray>•</dark_gray> <white>%total% added to the challenge</white>'
    - '[sound] ENTITY_EXPERIENCE_ORB_PICKUP 0.65 1.35'
crop-wand-deposit-line:
  enabled: true
  actions:
    - '[message] <dark_gray>  •</dark_gray> %crop% <dark_gray>—</dark_gray> <#FF8FBD>+%amount%</#FF8FBD>'
crop-wand-deposit-empty:
  enabled: true
  actions:
    - '[message] %prefix% <white>No eligible crops could be deposited. Crops with completed goals stay in storage.</white>'
crop-wand-seeds-removed:
  enabled: true
  actions:
    - '[message] %prefix% <white>Cleared <#FF8FBD>%amount%</#FF8FBD> seeds from storage.</white>'
    - '[sound] BLOCK_COMPOSTER_FILL_SUCCESS 0.65 1.1'
crop-wand-seeds-empty:
  enabled: true
  actions:
    - '[message] %prefix% <white>There were no seeds to clear from storage.</white>'
plant-wand-received:
  enabled: true
  actions:
    - '[message] %prefix% <white>Plant Wand received.</white> <gray>Left-click corner one, then right-click corner two to choose a crop.</gray>'
    - '[sound] ENTITY_ITEM_PICKUP 0.7 1.45'
plant-wand-inventory-full:
  enabled: true
  actions:
    - '[message] %prefix% <white>Make room in your inventory before requesting a Plant Wand.</white>'
plant-wand-first-corner:
  enabled: true
  actions:
    - '[message] %prefix% <white>First corner set at <#FF8FBD>%x%, %y%, %z%</#FF8FBD>.</white> <gray>Right-click the opposite corner.</gray>'
plant-wand-second-corner:
  enabled: true
  actions:
    - '[message] %prefix% <white>Second corner set at <#FF8FBD>%x%, %y%, %z%</#FF8FBD>.</white>'
plant-wand-first-needed:
  enabled: true
  actions:
    - '[message] %prefix% <white>Left-click the first corner before selecting the second.</white>'
    - '[sound] ENTITY_VILLAGER_NO 0.6 1.1'
plant-wand-second-needed:
  enabled: true
  actions:
    - '[message] %prefix% <white>Right-click the second corner to open the crop menu.</white>'
plant-wand-different-worlds:
  enabled: true
  actions:
    - '[message] %prefix% <white>Both Plant Wand corners must be in your current world.</white>'
    - '[sound] ENTITY_VILLAGER_NO 0.6 1.0'
plant-wand-too-large:
  enabled: true
  actions:
    - '[message] %prefix% <white>That selection contains <red>%volume%</red> blocks. The maximum is <#FF8FBD>%maximum%</#FF8FBD>.</white>'
    - '[sound] ENTITY_VILLAGER_NO 0.6 0.9'
plant-wand-no-farmland:
  enabled: true
  actions:
    - '[message] %prefix% <white>No empty farmland was found inside that selection.</white>'
    - '[sound] BLOCK_DISPENSER_FAIL 0.6 1.1'
plant-wand-no-crop:
  enabled: true
  actions:
    - '[message] %prefix% <white>You need <#FF8FBD>%item%</#FF8FBD> in your inventory to plant %crop%<white>.</white>'
    - '[sound] BLOCK_DISPENSER_FAIL 0.6 1.1'
plant-wand-plant-blocked:
  enabled: true
  actions:
    - '[message] %prefix% <white>Nothing could be planted there. Another protection plugin may be blocking the area.</white>'
    - '[sound] ENTITY_VILLAGER_NO 0.6 1.0'
plant-wand-planted:
  enabled: true
  actions:
    - '[message] %prefix% <white>Planted <#FF8FBD><bold>%amount%</bold></#FF8FBD> of <gray>%farmland%</gray> empty farmland with </white>%crop%<white>.</white>'
    - '[sound] ITEM_CROP_PLANT 0.85 1.15'
    - '[sound] BLOCK_AMETHYST_BLOCK_CHIME 0.55 1.65'
admin-help:
  enabled: true
  actions:
    - '[message] <gray>Admin:</gray> <#FF8FBD>/1m crops</#FF8FBD> <dark_gray>—</dark_gray> <white>manage challenge crops</white>'
    - '[message] <gray>Admin:</gray> <#FF8FBD>/1m automode [water|pistons|hoppers|all]</#FF8FBD> <dark_gray>—</dark_gray> <white>view or toggle farm crediting</white>'
    - '[message] <gray>Admin:</gray> <#FF8FBD>/1m summary [now]</#FF8FBD> <dark_gray>—</dark_gray> <white>inspect or run the harvest report</white>'
    - '[message] <gray>Admin:</gray> <#FF8FBD>/1m backup</#FF8FBD> <dark_gray>|</dark_gray> <#FF8FBD>reload</#FF8FBD> <dark_gray>|</dark_gray> <red>reset [crop] confirm</red>'
status:
  enabled: true
  actions:
    - '[message] <#FF8FBD><bold>CHALLENGE PROGRESS</bold></#FF8FBD> <dark_gray>•</dark_gray> <white>%completed%/%total% crops complete</white>'
    - '[message] <dark_gray>  •</dark_gray> %crop% <dark_gray>—</dark_gray> <white>%amount%/%target%</white> <dark_gray>(<gray>%percent%%</gray>)</dark_gray>'
milestone:
  enabled: true
  actions:
    - '[broadcast] %prefix% %crop% <white>reached <#FF8FBD><bold>%percent%%</bold></#FF8FBD>!</white>'
    - '[title] <#FF8FBD><bold>%percent%%</bold></#FF8FBD> | %crop% <white>milestone reached</white> | 5 | 35 | 10'
    - '[sound] ENTITY_PLAYER_LEVELUP 0.75 %pitch%'
    - '[particles] HAPPY_VILLAGER 24 0.6 0.8 0.6 0.05'
harvest-action-bar:
  enabled: true
  actions:
    - '[actionbar] %entries%'

harvestSummary:
  enabled: true
  amount: 30 # In minutes
  actions:
    - '[message] '
    - '[message] <#FF8FBD><bold>HARVEST REPORT</bold></#FF8FBD> <dark_gray>•</dark_gray> <white>LAST %minutes% MINUTES</white> <dark_gray>(<gray>%total% crops</gray>)</dark_gray>'
    - '[message] <dark_gray>  •</dark_gray> <white>%player%</white> <dark_gray>—</dark_gray> %amount-display% <white>harvested</white>'
    - '[message] '
    - '[sound] BLOCK_NOTE_BLOCK_CHIME 0.65 1.25'
harvest-summary-countdown:
  enabled: true
  actions:
    - '[countdown] <#FF8FBD><bold>NEXT HARVEST</bold></#FF8FBD> <dark_gray>•</dark_gray> <white>%time%</white> | GREEN | PROGRESS'
harvest-summary-status:
  enabled: true
  actions:
    - '[message] %prefix% <white>Next harvest report in <#FF8FBD>%time%</#FF8FBD>.</white> <gray>Current window: <white>%amount%</white> crops from <white>%players%</white> player(s).</gray>'
harvest-summary-forced:
  enabled: true
  actions:
    - '[message] %prefix% <white>Harvest report broadcast. A fresh <#FF8FBD>%minutes%-minute</#FF8FBD> window has started.</white>'
    - '[sound] UI_BUTTON_CLICK 0.7 1.35'
harvest-summary-not-scheduled:
  enabled: true
  actions:
    - '[message] %prefix% <white>The harvest report is not currently scheduled.</white>'
completed-broadcast:
  enabled: true
  actions:
    - '[broadcast] %prefix% <gradient:#FFE1EE:#FFC2DE:#FF8FBD><bold>CROP COMPLETE!</bold></gradient> %crop% <white>has reached <#FFC2DE>%target%</#FFC2DE>.</white>'
grand-finale:
  enabled: true
  actions:
    - '[broadcast] <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>'
    - '[broadcast] <gradient:#FFE1EE:#FFC2DE:#FF8FBD:#74C0FC:#C084FC><bold>EVERY CROP. ONE MILLION EACH.</bold></gradient>'
    - '[broadcast] <white>The One Million Crops challenge is complete. Absolute legends.</white>'
    - '[broadcast] <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>'
crop-celebration:
  enabled: true
  actions:
    - '[title] <gradient:#FFE1EE:#FFC2DE:#FF8FBD><bold>%target%!</bold></gradient> | %crop% <white>is complete!</white> | 10 | 80 | 20'
    - '[bossbar] <#FF8FBD><bold>CROP COMPLETE</bold></#FF8FBD> <dark_gray>•</dark_gray> %crop% | 8 | GREEN | PROGRESS | 1.0'
    - '[sound] %sound% %volume% %pitch%'
    - '[particles] TOTEM_OF_UNDYING 45 0.8 1.0 0.8 0.08'
    - '[firework] #FF8FBD,#FFC2DE,#FFFFFF | BALL_LARGE | 1 | %fireworks% | %firework-gap%'
finale-celebration:
  enabled: true
  actions:
    - '[title] <gradient:#FFE1EE:#FFC2DE:#FF8FBD:#74C0FC:#C084FC><bold>CHALLENGE COMPLETE</bold></gradient> | <white>Every crop. One million each. Legendary.</white> | 10 | 100 | 20'
    - '[bossbar] <gradient:#FFC2DE:#FF8FBD><bold>ONE MILLION CROPS COMPLETE</bold></gradient> | 12 | GREEN | PROGRESS | 1.0'
    - '[sound] %sound% %volume% %pitch%'
    - '[particles] TOTEM_OF_UNDYING 80 1.0 1.2 1.0 0.1'
    - '[firework] #FFC2DE,#FF8FBD,#74C0FC,#C084FC,#FFFFFF | STAR | 1 | %fireworks% | %firework-gap%'
